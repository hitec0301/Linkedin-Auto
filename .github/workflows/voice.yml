# JOB D — voice_amend. Applies rules the human accepted, proposes new ones.
#
# This job edits config/voice_card.md, which lives in the repo, so it commits
# the change back. Without that step the accepted rule would exist only in the
# runner's filesystem and vanish when the run ends.
name: voice

on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:

concurrency:
  group: voice
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run voice amendment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python jobs/voice_amend.py
      - name: Commit any accepted amendments
        run: |
          if [ -n "$(git status --porcelain config/voice_card.md)" ]; then
            git config user.name  "lnp-voice-job"
            git config user.email "actions@github.com"
            git add config/voice_card.md
            git commit -m "voice: apply accepted amendments"
            git push
          else
            echo "voice card unchanged"
          fi
