# Alembic owns the production schema. `create_all` exists for tests and for a
# first boot against an empty database; anything that changes a live table goes
# through a revision here, because a column added by import side effect is a
# column nobody can roll back.
[alembic]
script_location = alembic
prepend_sys_path = src
# sqlalchemy.url is deliberately absent: it comes from DATABASE_URL at runtime
# (see alembic/env.py), so a connection string is never committed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
